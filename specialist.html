<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda — Clean Face HMO</title>
    <link rel="stylesheet" href="css/specialist.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💆‍♀️</text></svg>">
</head>
<body>

<!-- ============================
     PANTALLA DE LOGIN
     ============================ -->
<div id="login-screen" class="sp-login-screen">
    <div class="sp-login-card">
        <div class="sp-login-logo">💆‍♀️</div>
        <h1 class="sp-login-title">Acceso Trabajadoras</h1>
        <p class="sp-login-subtitle">Selecciona tu perfil e ingresa tu PIN</p>

        <!-- Selección de especialista -->
        <div id="spec-select-list" class="sp-spec-select-list">
            <!-- Tarjetas inyectadas por JS -->
        </div>

        <!-- Form PIN -->
        <div id="pin-form-wrap" class="sp-pin-wrap" style="display:none;">
            <div class="sp-selected-info" id="sp-selected-info">
                <img src="" alt="" id="sp-selected-avatar" class="sp-selected-avatar">
                <div>
                    <div id="sp-selected-name" class="sp-selected-name"></div>
                    <div id="sp-selected-role" class="sp-selected-role"></div>
                </div>
            </div>

            <form id="pin-form">
                <input type="password" id="pin-input" class="sp-pin-input"
                    maxlength="6" placeholder="••••" autocomplete="off" inputmode="numeric" autofocus>
                <div id="pin-error" class="sp-pin-error"></div>
                <button type="submit" class="sp-btn-primary">Entrar a mi agenda</button>
            </form>
            <button id="btn-back-select" class="sp-btn-ghost">← Cambiar de perfil</button>
        </div>

        <a href="index.html" class="sp-link-home">← Volver al sitio web</a>
    </div>
</div>

<!-- ============================
     DASHBOARD DE LA TRABAJADORA
     ============================ -->
<div id="specialist-dashboard" class="sp-dashboard" style="display:none;">

    <!-- Header -->
    <header class="sp-header">
        <div class="sp-header-profile">
            <img src="" alt="" id="dash-avatar" class="sp-header-avatar">
            <div>
                <div id="dash-name" class="sp-header-name"></div>
                <div id="dash-role" class="sp-header-role"></div>
            </div>
        </div>
        <div class="sp-header-actions">
            <div class="sp-live-dot" title="Actualizando en vivo">● En vivo</div>
            <button id="btn-logout-spec" class="sp-btn-logout">Salir</button>
        </div>
    </header>

    <!-- Tabs de navegación -->
    <nav class="sp-tabs">
        <button class="sp-tab active" data-tab="today">📅 Hoy</button>
        <button class="sp-tab" data-tab="week">📆 Mi Semana</button>
        <button class="sp-tab" data-tab="upcoming">🔜 Próximas</button>
        <button class="sp-tab" data-tab="profile">👤 Mi Perfil</button>
    </nav>

    <!-- Contenido de tabs -->
    <main class="sp-main">

        <!-- TAB: HOY -->
        <section class="sp-tab-pane active" id="tab-today">
            <div class="sp-section-header">
                <div>
                    <h2 class="sp-section-title">Mis Citas de Hoy</h2>
                    <div id="today-date-label" class="sp-date-label"></div>
                </div>
                <div class="sp-today-badge" id="today-count-badge">0 citas</div>
            </div>
            <div id="today-appointments-list">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- TAB: SEMANA -->
        <section class="sp-tab-pane" id="tab-week">
            <div class="sp-section-header">
                <h2 class="sp-section-title">Mi Semana</h2>
                <div id="week-range-label" class="sp-date-label"></div>
            </div>
            <div id="week-calendar-grid" class="sp-week-grid">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- TAB: PRÓXIMAS -->
        <section class="sp-tab-pane" id="tab-upcoming">
            <div class="sp-section-header">
                <h2 class="sp-section-title">Próximas Citas</h2>
            </div>
            <div id="upcoming-list">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- TAB: MI PERFIL -->
        <section class="sp-tab-pane" id="tab-profile">
            <div class="sp-profile-card">
                <img src="" alt="" id="profile-avatar-big" class="sp-profile-avatar-big">
                <h2 id="profile-name-big" class="sp-profile-name-big"></h2>
                <div id="profile-role-big" class="sp-profile-role-big"></div>
                <p id="profile-bio" class="sp-profile-bio"></p>

                <div class="sp-profile-info-grid">
                    <div class="sp-info-item">
                        <div class="sp-info-label">📱 Teléfono / WhatsApp</div>
                        <div id="profile-phone" class="sp-info-value">—</div>
                    </div>
                    <div class="sp-info-item">
                        <div class="sp-info-label">📅 Días que trabajo</div>
                        <div id="profile-workdays" class="sp-info-value">—</div>
                    </div>
                    <div class="sp-info-item">
                        <div class="sp-info-label">🏁 Citas completadas (total)</div>
                        <div id="profile-total-done" class="sp-info-value">—</div>
                    </div>
                    <div class="sp-info-item">
                        <div class="sp-info-label">📊 Citas este mes</div>
                        <div id="profile-month-count" class="sp-info-value">—</div>
                    </div>
                </div>

                <div class="sp-profile-workdays-visual" id="profile-workdays-visual">
                    <!-- Badges de días inyectados por JS -->
                </div>
            </div>
        </section>

    </main>
</div>

<script src="js/data.js"></script>
<script src="js/specialist.js"></script>
</body>
</html>
